<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0e">
  <title>Titre de Transport</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stage">
    <div class="phone" id="phone">

      <div class="app-header">
        <a class="back-btn" href="index.html" aria-label="Retour à l&rsquo;accueil">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
        </a>
      </div>

      <div class="app-body">
        <div class="avatar-wrap">
          <div class="avatar-ring">
            <div class="avatar-circle">
              <img class="avatar-photo" src="assets/avatar.jpg" alt="Photo du voyageur">
            </div>
            <div class="avatar-orbit" id="dotsOrbit">
              <span class="avatar-dot dot-green top"></span>
              <span class="avatar-dot dot-blue bottom"></span>
            </div>
          </div>
          <p class="traveler-name">Aurele Dunand</p>
        </div>

        <div class="validity-track"><div class="validity-fill" id="validityFill"></div></div>
        <p class="validity-text" id="validityText">Correspondance autorisée encore 59 minutes</p>

        <div class="card">
          <div class="card-top">
            <div>
              <div class="card-title">10 voyages</div>
              <div class="card-subtitle">M réso</div>
            </div>
            <button class="bookmark-btn" type="button" id="bookmarkBtn" aria-pressed="false" aria-label="Enregistrer ce titre">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
            </button>
          </div>

          <div class="divider"></div>

          <p class="field-label">Période de validité</p>
          <p class="field-value" id="periodValue">
            <span>27/07/26</span><span class="sep">18:36</span>
            <span class="arrow">→</span>
            <span>27/07/26</span><span class="sep">19:36</span>
          </p>

          <p class="field-label">Dernière validation</p>
          <p class="field-value" id="lastValidation" style="margin-bottom:20px;">
            <span>27/07/26</span><span class="sep">18:36</span>
          </p>

          <button class="btn btn-purple" type="button" id="correspondanceBtn">VALIDER UNE CORRESPONDANCE</button>
        </div>

        <div class="actions">
          <button class="btn btn-purple" type="button" id="qrBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3z"/><path d="M20 14v3"/><path d="M14 20h3"/><path d="M20 20h.01"/></svg>
            AFFICHER MON CODE DE CONTRÔLE
          </button>
          <button class="btn btn-ghost" type="button" id="parkingBtn">
            <span class="parking-icon">P+R</span>
            ENTRER OU SORTIR D&rsquo;UN PARKING-RELAIS
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="qr-overlay" id="qrOverlay">
    <div class="qr-card">
      <h2>Code de contrôle</h2>
      <p>Présentez cet écran à l&rsquo;agent de contrôle</p>
      <div class="qr-grid" id="qrGrid" aria-hidden="true"></div>
      <button class="qr-close" type="button" id="qrClose">FERMER</button>
    </div>
  </div>

  <script src="fullscreen.js"></script>
  <script src="script.js"></script>
</body>
</html>
