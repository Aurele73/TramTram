<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0e">
  <title>TramTram</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stage">
    <div class="phone">

      <div class="statusbar">
        <span>18:36</span>
        <div class="icons">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l6 4.5-6 4.5V2z"/><path d="M12 11l6 4.5-6 4.5V11z"/><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
          <span style="font-size:13px;font-weight:600;">5G</span>
          <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><rect x="0" y="7" width="3" height="5" rx=".5" fill="#fff"/><rect x="4.5" y="5" width="3" height="7" rx=".5" fill="#fff"/><rect x="9" y="3" width="3" height="9" rx=".5" fill="#fff"/><rect x="13.5" y="0" width="3" height="12" rx=".5" fill="#fff"/></svg>
          <span class="battery-pct">44</span>
          <svg width="23" height="12" viewBox="0 0 23 12" aria-hidden="true"><rect x="0.5" y="0.5" width="19" height="11" rx="2.5" stroke="#fff" fill="none"/><rect x="2" y="2" width="7.5" height="8" rx="1" fill="#fff"/><rect x="20.5" y="4" width="2" height="4" rx="1" fill="#fff"/></svg>
        </div>
      </div>

      <div class="home-header">
        <div class="home-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16"/><path d="M8 7h8"/><path d="M8 21l1.5-3"/><path d="M16 21l-1.5-3"/></svg>
        </div>
        <span class="home-brand">TramTram</span>
      </div>

      <div class="home-body">
        <div class="home-hero">
          <div class="home-icon" aria-hidden="true">
            <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16"/><path d="M8 7h8"/><path d="M8 17l-1.5 3.5"/><path d="M16 17l1.5 3.5"/></svg>
          </div>
          <p class="home-greeting">Bonjour, Aurele</p>
          <p class="home-sub">Retrouvez votre titre de transport et validez vos correspondances en un geste.</p>
        </div>

        <div class="home-card">
          <div class="home-card-icon" aria-hidden="true">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>
          </div>
          <div>
            <p class="home-card-title">10 voyages &mdash; M réso</p>
            <p class="home-card-sub">Prêt à être activé pour 1 heure</p>
          </div>
        </div>

        <div class="home-actions">
          <a class="btn btn-purple" href="pass.html">AFFICHER MON TITRE DE TRANSPORT</a>
        </div>
      </div>

      <div class="navbar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M17 4L7 12l10 8V4z"/></svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1"/></svg>
      </div>
    </div>

    <p class="stage-caption">Recréation d&rsquo;interface &mdash; accueil</p>
  </div>

  <script src="fullscreen.js"></script>
</body>
</html>
